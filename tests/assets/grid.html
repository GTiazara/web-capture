<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <title>web-capture grid</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
        }

        body {
            width: 1280px;
            height: 3000px;
            position: relative;
            overflow-x: hidden;
        }

        .m {
            position: absolute;
            width: 400px;
            height: 300px;
        }

        /* Repères à positions documentaires connues, utilisés par les tests d'intégration. */
        #red {
            left: 100px;
            top: 50px;
            background: #ff0000;
        }

        #blue {
            left: 600px;
            top: 50px;
            background: #0000ff;
        }

        #green {
            left: 100px;
            top: 1050px;
            background: #00ff00;
        }
    </style>
</head>

<body>
    <div id="red" class="m"></div>
    <div id="blue" class="m"></div>
    <div id="green" class="m"></div>
</body>

</html>
