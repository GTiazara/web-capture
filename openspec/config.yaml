schema: spec-driven

context: |
  Python >= 3.11 ; dépendances et packaging gérés avec Poetry (pyproject.toml PEP 621, poetry.lock versionné, layout src/), environnement virtuel dans le projet (.venv/ via poetry.toml virtualenvs.in-project = true).
  Configuration via OmegaConf en structured config (schéma en dataclasses) : défauts < fichier YAML < surcharges dotlist en CLI ; OmegaConf reste confiné à l'adapter de configuration.
  Architecture hexagonale (ports & adapters) : domaine pur sans E/S, services applicatifs dépendant de ports (typing.Protocol), adapters en infrastructure, composition root unique sans framework d'injection.
  Design patterns uniquement quand ils répondent à un besoin identifié ; chaque design documente l'architecture concernée avec des diagrammes UML en Mermaid.
  Qualité : ruff (lint + format), mypy strict sur src/, pytest + pytest-asyncio avec tests unitaires sur faux ports et tests d'intégration marqués.

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
